<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Dispatcher Trainer · Mr Pool Leak Repair{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="ripple-bg" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="brand-mark">◍</span>
      <span class="brand-text">Mr Pool Leak Repair <em>Dispatcher Trainer</em></span>
    </a>
    <nav class="topnav">
      <a href="{{ url_for('index') }}">Personas</a>
    </nav>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <span>Internal training tool &middot; simulated calls only, not connected to real customers.</span>
  </footer>
</body>
</html>
